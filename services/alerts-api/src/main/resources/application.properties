spring.application.name=alerts-api
server.port=${PORT:8080}
server.shutdown=graceful

# --- Neon PostgreSQL (all values injected via environment) ---
spring.datasource.url=${DATABASE_JDBC_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# --- Upstash Redis over TCP with TLS ---
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}
spring.data.redis.timeout=5s

# --- CloudAMQP LavinMQ over AMQPS ---
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5671}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:true}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s

# --- Auth ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.auth.reset-token-ttl-minutes=${RESET_TOKEN_TTL_MINUTES:60}

# --- Password reset email (Resend; link logged instead when key unset) ---
app.web.base-url=${WEB_BASE_URL:http://localhost:3000}
app.resend.api-key=${RESEND_API_KEY:}
app.email.from=${EMAIL_FROM:Community Alerts <onboarding@resend.dev>}

# --- Application ---
app.amqp.exchange=alerts.topic
app.amqp.scored-queue=q.api.alert-scored
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.ml.base-url=${ML_SERVICE_URL:http://localhost:8000}
# Write-endpoint ceilings. An account is one person; an address is shared by a
# whole office or mobile carrier NAT pool, so it gets the looser ceiling.
app.rate-limit.max-per-minute=${RATE_LIMIT_PER_MINUTE:10}
app.rate-limit.anonymous-max-per-minute=${ANONYMOUS_RATE_LIMIT_PER_MINUTE:30}

# Sign-in throttling counts failures only, so correct sign-ins are never
# rationed. The per-account bucket is the real control; the per-address one is
# a backstop against a single host farming guesses across many accounts.
app.auth.throttle.failures-per-subject=${AUTH_FAILURES_PER_SUBJECT:10}
app.auth.throttle.failures-per-address=${AUTH_FAILURES_PER_ADDRESS:50}
app.auth.throttle.window-minutes=${AUTH_FAILURE_WINDOW_MINUTES:15}
app.cache.nearby-ttl-seconds=${NEARBY_CACHE_TTL_SECONDS:30}
# How long a 7-day stats snapshot stays servable. Keep in step with the
# worker's STATS_CACHE_TTL_SECONDS; either service may write the key.
app.cache.stats-ttl-seconds=${STATS_CACHE_TTL_SECONDS:900}
app.alerts.verify-threshold=${ALERT_VERIFY_THRESHOLD:3}

# --- Alert lifecycle: hours before an alert auto-expires, per category ---
# (categories without an entry default to 72h; V7 backfill mirrors these)
app.alerts.ttl-hours.SUSPICIOUS_ACTIVITY=24
app.alerts.ttl-hours.HARASSMENT=48
app.alerts.ttl-hours.HAZARD=48
app.alerts.ttl-hours.THEFT=72
app.alerts.ttl-hours.ASSAULT=72
app.alerts.ttl-hours.VEHICLE_CRIME=72
app.alerts.ttl-hours.OTHER=72
app.alerts.ttl-hours.VANDALISM=168
app.alerts.ttl-hours.BURGLARY=168
app.alerts.ttl-hours.DRUGS=168

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

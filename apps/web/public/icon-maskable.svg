<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Full bleed and square: Android supplies the launcher's own mask shape. -->
  <rect width="32" height="32" fill="#d03b3b"/>
  <!-- The same mark as icon.svg, scaled about its centroid and recentred so it
       stays inside the maskable safe zone (a circle 80% of the canvas). -->
  <g transform="translate(16 16) scale(0.85) translate(-16 -18.17)">
    <path d="M16 7.5 L25 23.5 H7 Z" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="16" y1="13.5" x2="16" y2="18" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="16" cy="20.8" r="1.3" fill="#ffffff"/>
  </g>
</svg>

name: Deploy to Azure

# Builds the four service images, pushes them to ACR, and rolls the Azure
# Container Apps to the new tag (the commit SHA). Runs automatically after the
# CI workflow succeeds on main, and can also be triggered manually.
#
# ---------------------------------------------------------------------------
# Required GitHub config  (Settings -> Secrets and variables -> Actions)
# ---------------------------------------------------------------------------
# Secrets:
#   AZURE_CLIENT_ID        app registration (service principal) client ID
#   AZURE_TENANT_ID        Azure AD tenant ID
#   AZURE_SUBSCRIPTION_ID  target subscription ID
# Variables:
#   ACR_NAME        Container Registry name (e.g. calertsd722b3bd) -> login
#                   server is <ACR_NAME>.azurecr.io
#   RESOURCE_GROUP  resource group holding the Container Apps
#                   (e.g. rg-community-alerts)
#   WEB_API_URL     public URL of the alerts API. Baked into the web image at
#                   BUILD time as NEXT_PUBLIC_API_URL (the browser's API URL),
#                   e.g. https://alerts-api.<env-domain>
#
# The service principal needs, on the target scope:
#   - AcrPush   on the registry
#   - Contributor (or "Container Apps Contributor") on the resource group
# Configure OIDC by adding a federated credential to the app registration:
#   subject: repo:flyinginsectsunpig/community-alerts-platform:ref:refs/heads/main
#
# NOTE: app names (web, alerts-api, ml-service, alert-processor) and the bare
# image repo paths match the live manual deployment, NOT the Terraform in
# infra/terraform (which uses different, unapplied names). Verify with:
#   az containerapp list -g <RESOURCE_GROUP> --query "[].name" -o tsv

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-azure
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC azure/login
  contents: read

jobs:
  deploy:
    name: Build, push, and roll Container Apps
    runs-on: ubuntu-latest
    # Deploy only when CI passed. workflow_dispatch has no workflow_run
    # payload, so let manual runs through explicitly.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      REGISTRY: ${{ vars.ACR_NAME }}.azurecr.io
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Build the exact commit CI validated (falls back to the ref for
          # manual runs).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build and push images
        run: |
          set -euo pipefail
          docker build -t "$REGISTRY/alerts-api:$IMAGE_TAG"      services/alerts-api
          docker build -t "$REGISTRY/ml-service:$IMAGE_TAG"      services/ml-service
          docker build -t "$REGISTRY/alert-processor:$IMAGE_TAG" services/alert-processor
          # Web bakes NEXT_PUBLIC_* at build time (browser-facing values).
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${{ vars.WEB_API_URL }}" \
            --build-arg NEXT_PUBLIC_VAPID_PUBLIC_KEY="${{ vars.WEB_VAPID_PUBLIC_KEY }}" \
            -t "$REGISTRY/web:$IMAGE_TAG" apps/web

          docker push "$REGISTRY/alerts-api:$IMAGE_TAG"
          docker push "$REGISTRY/ml-service:$IMAGE_TAG"
          docker push "$REGISTRY/alert-processor:$IMAGE_TAG"
          docker push "$REGISTRY/web:$IMAGE_TAG"

      - name: Roll Container Apps to the new image
        run: |
          set -euo pipefail
          RG="${{ vars.RESOURCE_GROUP }}"
          # alerts-api first: it owns the schema and runs Flyway on startup,
          # so migrations land before the worker/ml pick up the new revision.
          az containerapp update -n alerts-api      -g "$RG" --image "$REGISTRY/alerts-api:$IMAGE_TAG"
          az containerapp update -n ml-service      -g "$RG" --image "$REGISTRY/ml-service:$IMAGE_TAG"
          az containerapp update -n alert-processor -g "$RG" --image "$REGISTRY/alert-processor:$IMAGE_TAG"
          az containerapp update -n web             -g "$RG" --image "$REGISTRY/web:$IMAGE_TAG"

      # A green build says nothing about what the image actually serves.
      # /sw.js 404'd in production for weeks because Next's standalone output
      # omits public/ and the Dockerfile did not copy it — every deploy passed.
      # These paths are cheap to check and cover that whole class.
      - name: Smoke check the deployed web app
        run: |
          set -euo pipefail
          RG="${{ vars.RESOURCE_GROUP }}"
          FQDN=$(az containerapp show -n web -g "$RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Checking https://$FQDN"

          probe() { curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$1" || echo 000; }

          # Ingress runs at min 0 replicas, so the first request after a roll
          # may have to cold-start a container. Wait for the app to answer at
          # all before asserting on individual assets (5 min ceiling).
          code=000
          for _ in $(seq 1 30); do
            code=$(probe "https://$FQDN/")
            if [ "$code" = "200" ]; then break; fi
            sleep 10
          done
          if [ "$code" != "200" ]; then
            echo "::error::web never became healthy after the roll (last status $code)"
            exit 1
          fi

          # Served from apps/web/public (sw.js, icon-maskable.svg) and from
          # src/app route conventions (the rest) — both paths have broken before.
          failed=0
          for p in /sw.js /manifest.webmanifest /icon.svg /apple-icon.png /icon-maskable.svg; do
            code=$(probe "https://$FQDN$p")
            if [ "$code" = "200" ]; then
              echo "  ok    $p"
            else
              echo "  FAIL  $p -> $code"
              echo "::error::$p returned $code (expected 200)"
              failed=1
            fi
          done
          exit "$failed"

      # The web check cannot see alert-processor: it has no ingress, so a worker
      # that crash-loops on boot still leaves the deploy green. That is a live
      # risk now that the worker validates its push config at startup.
      - name: Smoke check the worker
        run: |
          set -euo pipefail
          RG="${{ vars.RESOURCE_GROUP }}"
          revision=$(az containerapp revision list -n alert-processor -g "$RG" \
            --query "sort_by([], &properties.createdTime)[-1].name" -o tsv)
          echo "Checking revision $revision"

          dump_logs() {
            echo "--- last 60 log lines ---"
            az containerapp logs show -n alert-processor -g "$RG" --tail 60 --format text || true
          }

          # min and max replicas are both 1, so a healthy worker reports
          # RunningAtMaxScale rather than Running.
          state=""
          for _ in $(seq 1 24); do
            state=$(az containerapp revision show -n alert-processor -g "$RG" \
              --revision "$revision" --query "properties.runningState" -o tsv 2>/dev/null || echo Unknown)
            case "$state" in
              Running|RunningAtMaxScale)
                echo "alert-processor is $state"
                exit 0
                ;;
              Failed|Degraded)
                echo "::error::alert-processor revision $revision is $state"
                dump_logs
                exit 1
                ;;
            esac
            echo "  $state - waiting"
            sleep 10
          done

          echo "::error::alert-processor did not start after the roll (last state: $state)"
          dump_logs
          exit 1

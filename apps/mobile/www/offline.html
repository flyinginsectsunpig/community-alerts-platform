<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Community Alerts</title>
    <style>
      /* Same light and dark palette as the site's globals.css. */
      :root {
        color-scheme: light dark;
        --page: oklch(0.968 0.006 85);
        --ink: oklch(0.24 0.02 260);
        --ink-2: oklch(0.42 0.018 260);
        --on-ink: oklch(0.995 0.003 85);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: oklch(0.145 0.008 265);
          --ink: oklch(0.975 0.002 265);
          --ink-2: oklch(0.815 0.008 265);
          --on-ink: oklch(0.145 0.008 265);
        }
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: var(--page);
        color: var(--ink);
        font: 16px/1.5 system-ui, sans-serif;
        text-align: center;
      }

      main {
        max-width: 32ch;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        line-height: 1.25;
        text-wrap: balance;
      }

      p {
        margin: 0 0 24px;
        color: var(--ink-2);
      }

      button {
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 12px;
        background: var(--ink);
        color: var(--on-ink);
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You&rsquo;re offline</h1>
      <!-- A safety app must not let a failed load read as a quiet neighbourhood. -->
      <p>Alerts can&rsquo;t load without a connection, so this doesn&rsquo;t mean your area is clear.</p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        location.replace("https://web.purpleflower-fcabaa8f.southafricanorth.azurecontainerapps.io/");
      });
    </script>
  </body>
</html>

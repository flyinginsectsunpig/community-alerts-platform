spring.application.name=alerts-api
server.port=${PORT:8080}
server.shutdown=graceful

# --- Neon PostgreSQL (all values injected via environment) ---
spring.datasource.url=${DATABASE_JDBC_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# --- Upstash Redis over TCP with TLS ---
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}
spring.data.redis.timeout=5s

# --- CloudAMQP LavinMQ over AMQPS ---
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5671}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:true}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s

# --- Auth ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# --- Application ---
app.amqp.exchange=alerts.topic
app.amqp.scored-queue=q.api.alert-scored
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.ml.base-url=${ML_SERVICE_URL:http://localhost:8000}
app.rate-limit.max-per-minute=${RATE_LIMIT_PER_MINUTE:10}
app.cache.nearby-ttl-seconds=${NEARBY_CACHE_TTL_SECONDS:30}
app.alerts.verify-threshold=${ALERT_VERIFY_THRESHOLD:3}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

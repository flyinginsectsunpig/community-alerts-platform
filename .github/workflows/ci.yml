name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  alerts-api:
    name: Alerts API (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/alerts-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify

  alert-processor:
    name: Alert Processor (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: dotnet test services/alert-processor/tests/AlertProcessor.Tests -c Release

  ml-service:
    name: ML Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ml-service/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  saps-import:
    name: SAPS importer (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/saps-import
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  docker-images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [web, alerts-api, alert-processor, ml-service, saps-import]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - name: Build all images
        run: |
          docker build -t community-alerts/web --build-arg NEXT_PUBLIC_API_URL=http://localhost:8080 apps/web
          docker build -t community-alerts/alerts-api services/alerts-api
          docker build -t community-alerts/alert-processor services/alert-processor
          docker build -t community-alerts/ml-service services/ml-service
      # Push to ACR here once infra is provisioned (see infra/terraform):
      #   az acr login --name <registry> && docker push ...
